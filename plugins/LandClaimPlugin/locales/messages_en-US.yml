# LandClaimPlugin - Messages Configuration
# Uses MiniMessage formatting exclusively: https://docs.advntr.dev/minimessage/format.html
accessDenied: <red>You do not have permission to do this.
chunkClaimed: <green>Chunk successfully claimed!
