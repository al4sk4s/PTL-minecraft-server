# PlayerTrustPermission GUI Configuration
# Materials must be valid Bukkit Material enum names.
# Names and lore support MiniMessage formatting (e.g., <red>Test</red>, <gradient:blue:aqua>Gradient</gradient>)
title: Player Trust Permission
# Decorative border
frame:
  material: WHITE_STAINED_GLASS_PANE
  name: ' '
  lore: []
# Navigation bar background
bottomFill:
  material: GRAY_STAINED_GLASS_PANE
  name: ' '
  lore: []
# Explains permission flags
info:
  material: NETHER_STAR
  name: <yellow><bold>Permission Info
  lore:
  - <gray>Configure what this trusted player
  - <gray>can do inside this claim.
# Return to previous menu
back:
  material: SPECTRAL_ARROW
  name: <yellow>Back
  lore:
  - <gray>Return to Trust Management
# Previous Page Button
previousPage:
  material: LIGHT_BLUE_CANDLE
  name: <aqua>Previous Page
  lore:
  - <gray>Go to the previous page.
# Next Page Button
nextPage:
  material: LIME_CANDLE
  name: <green>Next Page
  lore:
  - <gray>Go to the next page.
