# PlayerControlPanel GUI Configuration
# Materials must be valid Bukkit Material enum names.
# Names and lore support MiniMessage formatting (e.g., <red>Test</red>, <gradient:blue:aqua>Gradient</gradient>)
title: Player Control Panel
# Main UI framing
frame:
  material: GRAY_STAINED_GLASS_PANE
  name: ' '
  lore: []
# Bottom separator
accent:
  material: WHITE_STAINED_GLASS_PANE
  name: ' '
  lore: []
# Change Role Button
changeRole:
  material: SHELTER_POTTERY_SHERD
  name: <yellow>Change Role
  lore:
  - <gray>Click to assign a different
  - <gray>role to this player.
# Transfer Ownership Button
transferOwnership:
  material: SKULL_BANNER_PATTERN
  name: <red><bold>Transfer Ownership
  lore:
  - <gray>Transfer your claim ownership
  - <gray>to this player.
# Kick Player Button
kickPlayer:
  material: BED
  name: <red>Kick <Player>
  lore:
  - <gray>Remove this player from the claim.
# Return to previous menu
back:
  material: SPECTRAL_ARROW
  name: <yellow>Back
  lore:
  - <gray>Return to Members Management
