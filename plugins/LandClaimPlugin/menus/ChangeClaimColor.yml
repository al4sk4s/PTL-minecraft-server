# ChangeClaimColor GUI Configuration
# Materials must be valid Bukkit Material enum names.
# Names and lore support MiniMessage formatting (e.g., <red>Test</red>, <gradient:blue:aqua>Gradient</gradient>)
title: Change Color
# Background framing
frameFill:
  material: GRAY_STAINED_GLASS_PANE
  name: ' '
  lore: []
# Bottom navigation separators
navFrame:
  material: WHITE_STAINED_GLASS_PANE
  name: ' '
  lore: []
# Opens HEX color input
customColor:
  material: BRUSH
  name: <light_purple><bold>Custom Color
  lore:
  - <gray>Set a custom claim color
  - <gray>using hex code.
# Return to Claim Settings
back:
  material: SPECTRAL_ARROW
  name: <yellow>Back
  lore:
  - <gray>Return to Claim Settings
# Color Selection Options
colorBlack:
  material: BLACK_WOOL
  name: <black><bold>Black
  lore:
  - <gray>Set claim color to Black.
colorBlue:
